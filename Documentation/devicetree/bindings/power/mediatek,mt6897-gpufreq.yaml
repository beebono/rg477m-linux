%YAML 1.2
---
$id: http://devicetree.org/schemas/power/mediatek,mt6897-gpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6897 MFlexGraphics power controller (GPUEB)

maintainers:
  - FIXME Name <fixme@example.org>  # fill in before sending upstream

description:
  On MT6897 the GPUEB embedded MCU is started by the bootloader and does all
  GPU power and frequency sequencing. The AP sends it gpufreq IPIs over the
  GPUEB mailbox. The node is a power domain for the Mali GPU and provides a
  read-only clock reporting the frequency chosen by the GPUEB.

properties:
  $nodename:
    pattern: '^power-controller@[a-f0-9]+$'

  compatible:
    const: mediatek,mt6897-gpufreq

  reg:
    minItems: 4
    items:
      - description: GPUEB general purpose registers (GPR0..GPR24)
      - description: MFG_RPC registers, read for power status only
      - description: SPM XPU_PWR_STATUS and XPU_PWR_STATUS_2ND
      - description: GPUEB mailbox PDCA status register
      - description: first page of the GPU registers, read for identification

  reg-names:
    minItems: 4
    items:
      - const: gpr
      - const: rpc
      - const: spm-status
      - const: pdca-sta
      - const: gpu

  mboxes:
    maxItems: 11

  mbox-names:
    items:
      - const: fast-dvfs-event
      - const: gpufreq
      - const: sleep
      - const: timer
      - const: fhctl
      - const: ccf
      - const: gpumpu
      - const: fast-dvfs
      - const: ipir-c-met
      - const: ipis-c-met
      - const: brisket

  memory-region:
    items:
      - description: the gpufreq part of the GPUEB shared memory

  "#clock-cells":
    const: 0

  "#power-domain-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - mboxes
  - mbox-names
  - memory-region
  - "#clock-cells"
  - "#power-domain-cells"

additionalProperties: false
